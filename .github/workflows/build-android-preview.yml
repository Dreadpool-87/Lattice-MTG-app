name: Build Android 1.2 preview
on:
  push:
    branches: [verify/android-1.2-preview]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install Android SDK
        run: |
          sdk_root="$RUNNER_TEMP/lattice-android-sdk"
          curl -fsSL --retry 2 https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o "$RUNNER_TEMP/lattice-sdk.zip"
          unzip -q "$RUNNER_TEMP/lattice-sdk.zip" -d "$sdk_root"
          sdkmanager="$sdk_root/cmdline-tools/bin/sdkmanager"
          (yes || true) | "$sdkmanager" --sdk_root="$sdk_root" --licenses
          "$sdkmanager" --sdk_root="$sdk_root" "platforms;android-36.1" "build-tools;36.0.0"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
      - name: Build and run unit tests
        run: |
          keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Lattice Build Verification"
          gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Build unsigned release candidate
        run: |
          sed -i '/signingConfig = signingConfigs.getByName("release")/s/signingConfigs.getByName("release")/null/' app/build.gradle.kts
          gradle --no-daemon :app:assembleRelease
      - name: Upload unsigned release candidate
        uses: actions/upload-artifact@v4
        with:
          name: lattice-android-1.2-unsigned
          path: app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
          retention-days: 3
